<svg xmlns="http://www.w3.org/2000/svg" width="600" height="400" viewBox="0 0 600 400" role="img" aria-label="Flat vector Japanese landscape with a red torii gate over water at dusk">
  <rect width="600" height="400" fill="#fbeee9"/>
  <!-- dusk sun -->
  <circle cx="300" cy="150" r="95" fill="#c41a1a"/>
  <!-- geometric clouds -->
  <g fill="#f7d9d0" stroke="#2c2c2c" stroke-width="3">
    <path d="M60 90 h90 a18 18 0 0 1 0 36 h-90 a18 18 0 0 1 0-36 z"/>
    <path d="M430 70 h100 a16 16 0 0 1 0 32 h-100 a16 16 0 0 1 0-32 z"/>
  </g>
  <!-- distant hills -->
  <polygon points="0,240 130,180 260,240" fill="#1a2a3a"/>
  <polygon points="340,240 470,175 600,240" fill="#2b4257"/>
  <!-- water -->
  <rect x="0" y="240" width="600" height="160" fill="#1a2a3a"/>
  <g fill="none" stroke="#4a6b8a" stroke-width="3">
    <circle cx="120" cy="320" r="14"/><circle cx="120" cy="320" r="26"/>
    <circle cx="470" cy="340" r="12"/><circle cx="470" cy="340" r="22"/>
    <circle cx="300" cy="370" r="12"/><circle cx="300" cy="370" r="22"/>
  </g>
  <!-- big red torii standing in the water -->
  <g fill="#c41a1a" stroke="#2c2c2c" stroke-width="4">
    <rect x="200" y="150" width="200" height="26"/>
    <rect x="218" y="184" width="164" height="18"/>
    <rect x="226" y="176" width="24" height="200"/>
    <rect x="350" y="176" width="24" height="200"/>
    <rect x="292" y="202" width="16" height="60"/>
  </g>
  <!-- reflection -->
  <g fill="#8a1616" opacity="0.6">
    <rect x="226" y="376" width="24" height="20"/>
    <rect x="350" y="376" width="24" height="20"/>
  </g>
  <rect x="0" y="0" width="600" height="400" fill="none" stroke="#2c2c2c" stroke-width="8"/>
</svg>
