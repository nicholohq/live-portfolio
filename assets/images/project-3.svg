<svg xmlns="http://www.w3.org/2000/svg" width="600" height="400" viewBox="0 0 600 400" role="img" aria-label="Flat vector Japanese landscape with bamboo grove, a stone lantern and a great wave">
  <rect width="600" height="400" fill="#eef3ec"/>
  <!-- pale sun -->
  <circle cx="120" cy="110" r="60" fill="#f6c6d0"/>
  <!-- bamboo grove -->
  <g stroke="#2c2c2c" stroke-width="3">
    <rect x="70" y="40" width="16" height="240" fill="#6b8f5e"/>
    <rect x="110" y="20" width="16" height="260" fill="#8fc98a"/>
    <rect x="150" y="60" width="16" height="220" fill="#6b8f5e"/>
    <g stroke="#2c2c2c" stroke-width="3">
      <line x1="70" y1="110" x2="86" y2="110"/><line x1="70" y1="180" x2="86" y2="180"/>
      <line x1="110" y1="90" x2="126" y2="90"/><line x1="110" y1="160" x2="126" y2="160"/>
      <line x1="150" y1="130" x2="166" y2="130"/><line x1="150" y1="200" x2="166" y2="200"/>
    </g>
    <g fill="#6b8f5e"><ellipse cx="150" cy="70" rx="34" ry="10"/><ellipse cx="60" cy="120" rx="30" ry="9"/></g>
  </g>
  <!-- stone lantern -->
  <g fill="#8a8a7a" stroke="#2c2c2c" stroke-width="4">
    <rect x="440" y="270" width="40" height="20"/>
    <polygon points="435,270 485,270 470,240 450,240"/>
    <rect x="452" y="210" width="36" height="34"/>
    <polygon points="446,210 494,210 470,182"/>
    <rect x="462" y="290" width="16" height="30"/>
  </g>
  <g fill="#c41a1a"><rect x="458" y="218" width="24" height="18"/></g>
  <!-- The great wave (Seigaiha-inspired crest) -->
  <path d="M0 300 Q120 250 240 300 T480 300 T720 300 L720 400 L0 400 Z" fill="#1a2a3a"/>
  <g fill="#f5f0e8">
    <circle cx="120" cy="300" r="8"/><circle cx="240" cy="300" r="8"/>
    <circle cx="360" cy="300" r="8"/><circle cx="480" cy="300" r="8"/>
  </g>
  <path d="M0 340 Q150 300 300 340 T600 340 L600 400 L0 400 Z" fill="#2b4257"/>
  <rect x="0" y="0" width="600" height="400" fill="none" stroke="#2c2c2c" stroke-width="8"/>
</svg>
